---
# ansible-playbook playbook-debian.yml -u admin --private-key=/path/to/private/key -i "$ip,"
- name: copy files to remote server
  hosts: all
  vars:
    admin_home: "{{ ansible_env.HOME | default('/home/admin') }}"
  tasks:
  # OS
  - name: update packages
    become: true
    apt:
      update_cache: yes
  - name: install lsof  # just in case, is there by default
    become: true
    apt:
      name: lsof
      state: present

  # scenario-specific
  - name: copy badlog.py
    copy:
      src: ../files/badlog.py
      dest: "{{ admin_home }}/badlog.py"
  - name: set badlog.py
    file:
      path: "{{ admin_home }}/badlog.py"
      mode: "+x"
  - name: create log file
    become: true
    file:
      path: /var/log/bad.log
      state: touch
      owner: admin
      group: admin
  - name: cronjob
    cron:
      name: "reboot"
      special_time: reboot
      job: "{{ admin_home }}/badlog.py &"
  
  # check.sh
  - name: Create {{ admin_home }}/agent directory
    ansible.builtin.file:
      path: "{{ admin_home }}/agent"
      owner: admin
      group: admin
      mode: a+wx
      state: directory

  - name: copy check.sh
    copy:
      src: ../files/check.sh
      dest: "{{ admin_home }}/agent/check.sh"
  - name: set check.sh
    file:
      path: "{{ admin_home }}/agent/check.sh"
      mode: "+x"
