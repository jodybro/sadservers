---
# ansible-playbook playbook-debian.yml -u admin --private-key=/path/to/private/key -i "$ip,"
- name: Setup Docker Image Build Optimization scenario
  hosts: all
  vars:
    admin_home: "{{ ansible_env.HOME | default('/home/admin') }}"
  tasks:
  # OS packages and Docker installation
  - name: Update packages and install prerequisites
    become: true
    package:
      update_cache: yes
      state: latest
      name:
        - apt-transport-https
        - ca-certificates
        - curl
        - gnupg
        - lsb-release
        - bc

  - name: Add Docker GPG key
    become: true
    apt_key:
      url: https://download.docker.com/linux/debian/gpg
      state: present

  - name: Add Docker repository
    become: true
    apt_repository:
      repo: "deb [arch=amd64] https://download.docker.com/linux/debian {{ ansible_distribution_release }} stable"
      state: present

  - name: Install Docker
    become: true
    package:
      update_cache: yes
      state: latest
      name:
        - docker-ce
        - docker-ce-cli
        - containerd.io

  - name: Add admin user to docker group
    become: true
    user:
      name: admin
      groups: docker
      append: yes

  - name: Start and enable Docker service
    become: true
    systemd:
      name: docker
      state: started
      enabled: yes

  # Scenario files setup
  - name: Create {{ admin_home }}/agent directory
    ansible.builtin.file:
      path: "{{ admin_home }}/agent"
      owner: admin
      group: admin
      mode: a+wx
      state: directory

  - name: Copy Docker optimization scenario files
    become: false
    copy:
      src: "{{ item.src }}"
      dest: "{{ item.dest }}"
      mode: "{{ item.mode | default('0644') }}"
    with_items:
      - { src: ../files/Dockerfile.base, dest: "{{ admin_home }}/Dockerfile.base" }
      - { src: ../files/Dockerfile.optimized, dest: "{{ admin_home }}/Dockerfile.optimized" }
      - { src: ../files/Gemfile, dest: "{{ admin_home }}/Gemfile" }
      - { src: ../files/Gemfile.lock, dest: "{{ admin_home }}/Gemfile.lock" }
      - { src: ../files/entrypoint.sh, dest: "{{ admin_home }}/entrypoint.sh", mode: '0755' }
      - { src: ../files/sidekiq_shutdown.rb, dest: "{{ admin_home }}/sidekiq_shutdown.rb", mode: '0755' }
      - { src: ../files/time_builds.sh, dest: "{{ admin_home }}/time_builds.sh", mode: '0755' }
      - { src: ../files/setup_scenario.sh, dest: "{{ admin_home }}/setup_scenario.sh", mode: '0755' }

  - name: Copy check.sh to agent directory
    copy:
      src: ../files/check.sh
      dest: "{{ admin_home }}/agent/check.sh"
      mode: '0755'

  - name: Run scenario setup script
    become: false
    shell: "{{ admin_home }}/setup_scenario.sh"
    args:
      creates: "{{ admin_home }}/docker-optimization"
    environment:
      ADMIN_HOME: "{{ admin_home }}"

  - name: Copy timing script to scenario directory
    become: false
    copy:
      src: ../files/time_builds.sh
      dest: "{{ admin_home }}/docker-optimization/time_builds.sh"
      mode: '0755'
